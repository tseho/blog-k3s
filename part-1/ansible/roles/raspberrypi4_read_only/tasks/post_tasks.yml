---
- meta: flush_handlers

- name: Make root partition read only
  ansible.builtin.command:
    cmd: mount -o remount,ro /
  changed_when: false
  failed_when: false
  register: root_remount

- name: Make boot partition read only
  ansible.builtin.command:
    cmd: mount -o remount,ro /boot/firmware
  changed_when: false

- name: reboot
  ansible.builtin.reboot:
    post_reboot_delay: 60
    reboot_timeout: 180
    connect_timeout: 60
  timeout: 300
  changed_when: false
  when: root_remount.stderr is search('mount point is busy')
