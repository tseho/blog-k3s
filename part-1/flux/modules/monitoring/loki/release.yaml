apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  chart:
    spec:
      chart: loki
      version: "~6.19.0"
      sourceRef:
        kind: HelmRepository
        name: loki
        namespace: monitoring
  interval: 1h
  timeout: 5m
  releaseName: loki
  targetNamespace: monitoring
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # https://github.com/grafana/loki/blob/helm-loki-6.19.0/production/helm/loki/values.yaml
    deploymentMode: SingleBinary
    loki:
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-11-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      ingester:
        chunk_encoding: snappy
      tracing:
        enabled: true
      querier:
        # If you have enough memory and CPU you can increase
        max_concurrent: 1
      storage:
        type: filesystem
      auth_enabled: false
    singleBinary:
      replicas: 1
      resources:
        limits:
          cpu: 3
          memory: 4Gi
        requests:
          cpu: 1 # should be 2
          memory: 1Gi #should be 2Gi
      extraEnv:
        - name: GOMEMLIMIT
          value: 3750MiB
    gateway:
      enabled: false
    chunksCache:
      enabled: false
      # default is 500MB, with limited memory keep this smaller
      writebackSizeLimit: 10MB
    resultsCache:
      enabled: false

    # tests
    test:
      enabled: true
    lokiCanary:
      enabled: true

    # Zero out replica counts of other deployment modes
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
