apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  chart:
    spec:
      chart: grafana
      version: "~8.5.11"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  interval: 1h
  timeout: 5m
  releaseName: grafana
  targetNamespace: monitoring
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # https://github.com/grafana/helm-charts/blob/main/charts/grafana/values.yaml
    persistence:
      type: pvc
      enabled: true
    initChownData:
      enabled: false
    sidecar:
      dashboards:
        enabled: true
      datasources:
        enabled: true
