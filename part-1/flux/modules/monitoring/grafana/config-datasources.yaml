apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |-
    apiVersion: 1
    prune: true
    datasources:
      - name: "Prometheus"
        type: prometheus
        url: http://prometheus-prometheus:9090
        access: proxy
      - name: "Loki"
        type: loki
        url: http://loki:3100
