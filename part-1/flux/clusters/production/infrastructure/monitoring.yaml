---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  path: ./modules/monitoring
  postBuild:
    substitute:
      domain: "example.com"

  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
